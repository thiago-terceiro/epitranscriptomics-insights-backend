name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        run: |
          docker build -t ghcr.io/${{ github.repository }}/epimod-api:sha-${{ github.sha }} -f Dockerfile.api .
          docker build -t ghcr.io/${{ github.repository }}/epimod-worker:sha-${{ github.sha }} -f Dockerfile.worker .
          docker push ghcr.io/${{ github.repository }}/epimod-api:sha-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/epimod-worker:sha-${{ github.sha }}
