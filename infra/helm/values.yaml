image:
  api: ghcr.io/yourorg/epimod-api:0.1.0  # TODO: pin by digest for production
  worker: ghcr.io/yourorg/epimod-worker:0.1.0  # TODO: pin by digest
  pullPolicy: IfNotPresent

podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

replicaCount:
  api: 2
  worker: 3

autoscaling:
  worker:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 8080

resources:
  api:
    limits: {cpu: "2", memory: "2Gi"}
    requests: {cpu: "500m", memory: "512Mi"}
  worker:
    limits: {cpu: "8", memory: "16Gi"}
    requests: {cpu: "2", memory: "4Gi"}

livenessProbe:
  api:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
  worker:
    enabled: false  # customize with a lightweight script if needed

readinessProbe:
  api:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 15
  worker:
    enabled: false

# Optional worker probes (command based)
workerProbes:
  liveness:
    enabled: false
    command: ["/bin/sh", "-c", "echo ok"]  # replace with real heartbeat check
    initialDelaySeconds: 30
    periodSeconds: 60
  readiness:
    enabled: false
    command: ["/bin/sh", "-c", "echo ready"]
    initialDelaySeconds: 10
    periodSeconds: 30

serviceAccount:
  create: true
  name: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

postgresql:
  auth:
    username: epi
    password: epi_pass
    database: epimod
  primary:
    persistence:
      enabled: true
      size: 10Gi

rabbitmq:
  auth:
    username: guest
    password: guest
  persistence:
    enabled: true
    size: 5Gi

minio:
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  persistence:
    size: 20Gi
  defaultBuckets: mlflow

# Extra environment variables (non-secret) to inject into pods
extraEnv: []  # e.g. [{ name: LOG_LEVEL, value: info }]

# Reference existing secret instead of creating one (set to name of secret)
existingSecret: ""

# Annotations for pods
podAnnotations: {}

# Node selection / tolerations
nodeSelector: {}
affinity: {}
tolerations: []

# Pod Disruption Budgets
pdb:
  api:
    enabled: true
    minAvailable: 1
  worker:
    enabled: true
    minAvailable: 2

# Horizontal Pod Autoscaler for API
hpa:
  api:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80  # optionally enable

# Network Policy toggles
networkPolicy:
  enabled: true
  allowNamespaces: []  # additional namespaces allowed to reach API
  api:
    ingressPorts: [8080]
  worker:
    enabled: true
  postgres:
    enabled: true
  rabbitmq:
    enabled: true
  minio:
    enabled: true
