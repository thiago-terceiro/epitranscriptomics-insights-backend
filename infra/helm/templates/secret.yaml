{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: epimod-secrets
type: Opaque
stringData:
  # NOTE: These defaults are for development only. Override via --set or a custom values file.
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_HOST: "epimod-postgresql"
  POSTGRES_PORT: "5432"
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | quote }}
  RABBITMQ_PASS: {{ .Values.rabbitmq.auth.password | quote }}
  RABBITMQ_HOST: "epimod-rabbitmq"
  MINIO_ACCESS_KEY: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.auth.rootPassword | quote }}
  MINIO_ENDPOINT: "epimod-minio:9000"
  JWT_SECRET: "change_me" # TODO: Provide a secure random value
{{- end }}
